spring.application.name=notifications
server.port=${SERVER_PORT:8084}

# RDS PostgreSQL: DB_URL, DB_USERNAME y DB_PASSWORD deben estar definidos en el entorno.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.rabbitmq.host=${RABBITMQ_HOST:98.91.71.40}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:}
spring.rabbitmq.ssl.enabled=${RABBITMQ_SSL:false}
spring.rabbitmq.listener.simple.auto-startup=true

# SMTP: Gmail por defecto; para Mailpit local se cambian las variables MAIL_* al arrancar.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://fabetabilo.github.io}
app.newsletter.api-base-url=${NOTIFICATIONS_PUBLIC_API_URL:http://localhost:8084}
app.newsletter.public-base-url=${FRONT_URL:${PUBLIC_SITE_URL:http://localhost:5173}}
app.newsletter.from=${MAIL_FROM:boletin@athenet.test}
app.newsletter.confirmation-ttl=48h
app.newsletter.worker-enabled=true
app.newsletter.dispatch-delay=5000
app.newsletter.max-attempts=5
app.newsletter.batch-size=20
spring.rabbitmq.dynamic=true

# Registro público: configurar TURNSTILE_SECRET_KEY en el entorno, sin otro perfil.
# Sin clave, el servicio arranca pero POST /subscriptions devuelve 503.
app.turnstile.secret-key=${TURNSTILE_SECRET_KEY:}
# Hostname observado en Siteverify con la clave pública de prueba; usar el dominio del front con la clave real.
app.turnstile.allowed-hostnames=${TURNSTILE_ALLOWED_HOSTNAMES:example.com}
app.subscriptions.rate-limit.window=15m
app.subscriptions.rate-limit.per-email=3
app.subscriptions.rate-limit.per-ip=20
app.subscriptions.rate-limit.max-entries=20000
# No confiar en Forwarded/X-Forwarded-For enviados directamente por el cliente.
server.forward-headers-strategy=none

spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.connection-timeout=5s
app.newsletter.publisher-enabled=true
app.newsletter.confirmation-publisher-enabled=true
app.newsletter.publish-confirm-timeout=5s
# Activar después de migrar el esquema y preparar el productor de Eventos.
app.newsletter.events-enabled=${NEWSLETTER_EVENTS_ENABLED:false}

spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}
